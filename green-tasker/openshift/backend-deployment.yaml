apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-tasker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: green-tasker-backend
  template:
    metadata:
      labels:
        app: green-tasker-backend
    spec:
      containers:
      - name: backend
        image: <your-registry>/green-tasker-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: green-tasker-backend
spec:
  selector:
    app: green-tasker-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: green-tasker-backend
spec:
  to:
    kind: Service
    name: green-tasker-backend
  port:
    targetPort: 5000