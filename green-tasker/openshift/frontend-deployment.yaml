apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-tasker-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: green-tasker-frontend
  template:
    metadata:
      labels:
        app: green-tasker-frontend
    spec:
      containers:
      - name: frontend
        image: registry.access.redhat.com/ubi8/nginx-118:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
        - name: entrypoint
          mountPath: /docker-entrypoint.d
        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: backend-url
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat > /docker-entrypoint.d/01-config.sh <<'SCRIPT'
          #!/bin/sh
          BACKEND_URL="${BACKEND_URL:-http://127.0.0.1:5000}"
          cat > /usr/share/nginx/html/config.js <<EOF
          window.API_URL = "${BACKEND_URL}";
          EOF
          echo "Frontend configured with API URL: ${BACKEND_URL}"
          SCRIPT
          chmod +x /docker-entrypoint.d/01-config.sh
          /docker-entrypoint.d/01-config.sh
          exec nginx -g "daemon off;"
      volumes:
      - name: www
        configMap:
          name: frontend-html
      - name: entrypoint
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: green-tasker-frontend
spec:
  selector:
    app: green-tasker-frontend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: green-tasker-frontend
spec:
  to:
    kind: Service
    name: green-tasker-frontend
  port:
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  backend-url: ""  # Will be set to backend route URL after deployment
---
# Note: After deploying the backend, update the frontend-config ConfigMap:
# 1. Get backend route: oc get route green-tasker-backend -o jsonpath='{.spec.host}'
# 2. Update ConfigMap: oc set data configmap/frontend-config backend-url="https://<route-host>"
# 3. Restart frontend: oc rollout restart deployment/green-tasker-frontend