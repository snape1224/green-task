<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTasker - by ReLeaf Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
<header class="d-flex justify-content-between align-items-center mb-4">
<h1 class="h3">GreenTasker <small class="text-success">by ReLeaf Tech</small></h1>
<div id="green-score-badge" class="fw-bold">Green Score: --</div>
</header>


<div class="row">
<div class="col-md-6">
<div class="card mb-3">
<div class="card-body">
<h5 class="card-title">Add Task</h5>
<form id="task-form">
<div class="mb-2">
<input id="task_name" class="form-control" placeholder="Task name" required>
</div>
<div class="mb-2 d-flex gap-2">
<input id="hours" type="number" class="form-control" placeholder="Hours" value="1" min="0.1" step="0.1">
<input id="category" class="form-control" placeholder="Category">
</div>
<div class="mb-2">
<select id="energy_level" class="form-select">
<option>Low</option>
<option selected>Medium</option>
<option>High</option>
</select>
</div>
<button class="btn btn-success">Add</button>
</form>
</div>
</div>


<div class="card">
<div class="card-body">
<h5 class="card-title">Tasks</h5>
<table class="table" id="tasks-table">
<thead><tr><th>Name</th><th>Hours</th><th>Energy</th><th>Score</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>


<div class="col-md-6">
<div class="card mb-3">
<div class="card-body">
<h5 class="card-title">Analytics</h5>
<canvas id="distChart" height="200"></canvas>
<div class="mt-3" id="tips"></div>
</div>
</div>
</div>
</div>


</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="./config.js"></script>
<script>
// Fallback API URL if config.js is not available
if (typeof window.API_URL === 'undefined') {
    window.API_URL = 'http://127.0.0.1:5000';
}
</script>
<script src="./app.js"></script>
</body>
</html>
